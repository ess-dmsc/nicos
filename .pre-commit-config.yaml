repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    - id: codespell
# Ignore certain file paths: uses regex pattern. Primarily used by
# pre-commit-hooks, other hooks might have their own exclude pattern signature.
# Upstream-owned paths keep the upstream style; see UPSTREAM.md.
exclude: '^(nicos|nicos_mlz|nicos_demo|nicostools|tools|bin|resources)/|^conftest\.py$|^test/(bin|faulty_setups|fixtures|nexus|scripts|script_templates|setups|test_basic|test_console|test_custom|test_daemon|test_gui|test_secop|test_simple|test_simulation|test_stresstest)/|^test/(utils|__init__)\.py$'
